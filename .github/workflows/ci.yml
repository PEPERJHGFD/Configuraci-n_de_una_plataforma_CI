name: CI Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install pytest pytest-cov
      - name: Ejecutar pruebas y cobertura
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml
      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Build proyecto
        run: |
          mkdir artefactos
          cp calculadora.py artefactos/
      - name: Generar ZIP
        run: zip -r artefacto.zip artefactos
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: build-python
          path: artefacto.zip